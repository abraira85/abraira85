<svg width="1600" height="380" viewBox="0 0 1600 380" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="t d">
<title id="t">Laboratorio privado — registro en vivo</title>
<desc id="d">Los experimentos de IA y de producto permanecen privados hasta que merecen mostrarse.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0D0D1F"/>
<stop offset="1" stop-color="#06060F"/>
</linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#8B5CF6"/>
<stop offset="1" stop-color="#EC4899"/>
</linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#C4B5FD" stop-opacity="0"/>
<stop offset="0.5" stop-color="#C4B5FD" stop-opacity="0.12"/>
<stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/>
</linearGradient>
<filter id="blur4" x="-300%" y="-10%" width="700%" height="120%">
<feGaussianBlur stdDeviation="4"/>
</filter>
<clipPath id="vp"><rect x="24" y="64" width="1552" height="292"/></clipPath>
</defs>
<rect x="2" y="2" width="1596" height="376" rx="14" fill="url(#bg)" stroke="#1E2440" stroke-width="1.5"/>
<rect x="4" y="20" width="3" height="340" rx="1.5" fill="url(#bar)" filter="url(#blur4)" opacity="0.4"/>
<rect x="4" y="20" width="3" height="340" rx="1.5" fill="url(#bar)"/>
<line x1="3" y1="52.5" x2="1597" y2="52.5" stroke="#1E2440" stroke-width="1"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
<text x="44" y="33" font-size="20"><tspan fill="#38BDF8">❯ </tspan><tspan fill="#C4B5FD">tail -f /var/log/lab.log</tspan></text>
<circle cx="1428" cy="27" r="6" fill="#EC4899">
<animate attributeName="opacity" values="1;0.3;1" keyTimes="0;0.5;1" dur="2.2s" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>
</circle>
<text x="1552" y="33" font-size="18" fill="#EC4899" text-anchor="end">privado</text>
</g>
<g clip-path="url(#vp)">
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="24">
<animateTransform attributeName="transform" type="translate" values="0 0;0 -280" dur="15s" repeatCount="indefinite" calcMode="linear"/>
<g id="rows">
<text x="56" y="100"><tspan fill="#8B5CF6">[lab]</tspan><tspan fill="#8A93B2"> flujo-ia</tspan></text>
<rect x="300" y="83" width="300" height="22" rx="4" fill="#262C4A" stroke="#1E2440" stroke-width="1"/>
<text x="618" y="100" fill="#8A93B2">estado: privado</text>
<text x="56" y="156"><tspan fill="#8B5CF6">[lab]</tspan><tspan fill="#8A93B2"> plataforma-interna</tspan></text>
<rect x="452" y="139" width="220" height="22" rx="4" fill="#262C4A" stroke="#1E2440" stroke-width="1"/>
<text x="690" y="156" fill="#8A93B2">estado: privado</text>
<text x="56" y="212"><tspan fill="#8B5CF6">[lab]</tspan><tspan fill="#8A93B2"> herramientas-agente</tspan></text>
<rect x="468" y="195" width="260" height="22" rx="4" fill="#262C4A" stroke="#1E2440" stroke-width="1"/>
<text x="746" y="212" fill="#8A93B2">estado: privado</text>
<text x="56" y="268"><tspan fill="#8B5CF6">[lab]</tspan><tspan fill="#C4B5FD"> política: público cuando está limpio, útil y listo</tspan></text>
<text x="56" y="324"><tspan fill="#8B5CF6">[lab]</tspan><tspan fill="#C4B5FD"> filtro de publicación: "merece mostrarse" — activado</tspan></text>
</g>
<use href="#rows" xlink:href="#rows" y="280"/>
</g>
<g>
<animateTransform attributeName="transform" type="translate" values="-200 0;1800 0" dur="6s" repeatCount="indefinite" calcMode="linear"/>
<rect x="-60" y="-40" width="120" height="420" fill="url(#shine)" transform="rotate(20)"/>
</g>
</g>
</svg>