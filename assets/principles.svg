<svg width="1496" height="272" viewBox="0 0 1496 272" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">how I work</title>
<desc id="d">Working principles: understand the real problem before writing code; keep architecture simple, explicit and scalable; build useful software, not just technical demos; automate repetitive work whenever it has real leverage; improve developer experience and delivery flow; connect business needs with technical execution; make technical decisions with practical impact; think in products, systems and outcomes.</desc>
